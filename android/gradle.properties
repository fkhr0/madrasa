# 4 GB is enough for this app and leaves room on a PC with little memory.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: and Flutter's package cache on C:; Kotlin's
# incremental cache can't handle files on two drives ("Could not close
# incremental caches"). Full compiles instead: a little slower, always works.
kotlin.incremental=false
