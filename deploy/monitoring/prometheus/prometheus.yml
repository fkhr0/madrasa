# What Prometheus collects, every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The two API copies: requests, timings, errors, live connections, cache.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api1:3000", "api2:3000"]

  # The server: CPU, memory, disk, network.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Each container's CPU and memory.
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
