user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time up=$upstream_addr ua="$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_max_body_size 55m;
  client_body_timeout 180s;

  limit_req_zone  $binary_remote_addr zone=per_ip:20m rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=sign_in:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  upstream api {
    least_conn;
    server api1:3000 max_fails=2 fail_timeout=10s;
    server api2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
