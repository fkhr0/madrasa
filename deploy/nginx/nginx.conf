# Nginx: the only thing reachable from the internet. HTTPS, the two API
# copies behind one address, limits against floods. The site itself is in
# templates/madrasa.conf.template (${DOMAIN} filled in at start).
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent '
                  'rt=$request_time up=$upstream_addr ua="$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Uploads: videos up to 50 MB (the app checks the exact limit).
  client_max_body_size 55m;
  client_body_timeout 180s;

  # ── Limits per visitor address ──
  # The API also limits per person; this stops floods before they reach it.
  limit_req_zone  $binary_remote_addr zone=per_ip:20m rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=sign_in:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # WebSocket: "Connection: upgrade" only when the app asks for it.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # The two API copies. least_conn: the less busy one gets the next request.
  # A copy that fails is skipped for 10 s (deploys restart one at a time).
  upstream api {
    least_conn;
    server api1:3000 max_fails=2 fail_timeout=10s;
    server api2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
