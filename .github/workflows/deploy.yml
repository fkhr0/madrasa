# Push to main → tests → image for the server (ARM) → scan → rolling deploy.
# Secrets (repository Settings → Secrets and variables → Actions):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET  Tailscale OAuth client (tag:ci)
#   DEPLOY_HOST                          the server's Tailscale name, e.g. madrasa
#   DEPLOY_SSH_KEY                       a private key the server accepts
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/madrasa-api

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  # The web app goes inside the image (the server shows it). Flutter runs on
  # a normal machine; the image is built on an ARM one.
  web:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.44.4, cache: true }
      - run: flutter build web --release --no-wasm-dry-run --no-web-resources-cdn --dart-define=API_URL=origin
      - uses: actions/upload-artifact@v7
        with: { name: web, path: build/web, retention-days: 1 }

  image:
    needs: web
    # Free ARM machines for public repositories: a native build for the server.
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: web, path: build/web }

      - id: tag
        run: echo "tag=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Known holes in the image (OS packages and Node packages).
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: image
    # On once the server exists: Settings → Variables → DEPLOY_ENABLED = true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Into the private network: the server's SSH isn't open to the internet.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Rolling deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.image.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && printf '%s\n' "$SSH_KEY" > ~/.ssh_key
          ssh_server() { ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new "ubuntu@$HOST" "$@"; }
          # The registry token goes through stdin, never into a command line.
          printf '%s' "$REGISTRY_TOKEN" | ssh_server "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          ssh_server "cd /opt/madrasa && git pull --ff-only && bash deploy/scripts/deploy.sh '$TAG'"
