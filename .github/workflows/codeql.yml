# CodeQL: GitHub's code security scanner reads the server's code for
# injection, path tricks, unsafe regular expressions and the like. Results:
# the repository's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths: [server/src]
      - uses: github/codeql-action/analyze@v3
